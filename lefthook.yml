source_dir: .githooks
pre-commit:
  piped: true
  commands:
    secrets:
      priority: 1
      run: sh -c '. .githooks/hook-lib.sh; secrets_scan_index'
    lint:
      priority: 2
      run: bun --no-env-file src/cli.ts lint
    tests:
      priority: 3
      run: bun --no-env-file src/cli.ts run --staged --set commit
pre-merge-commit:
  commands:
    secrets:
      run: sh -c '. .githooks/hook-lib.sh; secrets_scan_index'
pre-push:
  piped: true
  jobs:
    # A script, not a command: lefthook can skip a pre-push command by file matching.
    - script: secrets
      runner: sh
      use_stdin: true
    - name: tests
      run: bun --no-env-file src/cli.ts run --jobs 2 --set push
sprint:
  # Land pushes next, and pre-push runs the whole suite; this only checks the lockfile.
  # no `skip:` here: land runs this mid-merge
  commands:
    install:
      run: bun install --frozen-lockfile
