# The project's checks. Test commands live here and nowhere else.
source_dir: .githooks
pre-commit:
  piped: true
  commands:
    secrets:
      priority: 1
      run: sh -c '. .githooks/hook-lib.sh; secrets_scan_index'
    lint:
      priority: 2
      run: bun run lint && bun run typecheck
    tests:
      # Quick tests. Keep this under a minute: it runs on every commit.
      priority: 3
      run: bun test --path-ignore-patterns '**/*.slow.test.ts'
pre-merge-commit:
  commands:
    secrets:
      run: sh -c '. .githooks/hook-lib.sh; secrets_scan_index'
pre-push:
  piped: true
  jobs:
    # A script, not a command: lefthook can skip a pre-push command by file matching.
    - script: secrets
      runner: sh
      use_stdin: true
    - name: tests
      # proof re-runs the suite only when something it covers changed. The timeout in proof.yaml
      # is for other clones loading this shared Mac.
      run: bun --no-env-file src/cli.ts run
sprint:
  # Land pushes next, and pre-push runs the whole suite; this only checks the lockfile.
  # no `skip:` here: land runs this mid-merge
  commands:
    install:
      run: bun install --frozen-lockfile
