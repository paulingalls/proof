version: 1
project: proof
inputs:
  code:
    - src/**
    - test/**
    - scripts/**
    - package.json
    - bun.lock
    - tsconfig.json
tasks:
  lint:
    run: bun run lint
    inputs: [$code, biome.json, .gitignore]
    links: [node_modules]
    sets: [commit, push]
  typecheck:
    run: bun run typecheck
    inputs: [$code]
    links: [node_modules]
    sets: [commit, push]
  test-fast:
    run: bun run test-fast
    inputs:
      - src/**
      - test/**/*.test.ts
      - '!test/**/*.slow.test.ts'
      - test/support/repo.ts
      - test/support/suite.ts
      - package.json
      - tsconfig.json
      - proof.yaml
    sets: [commit, push]
  test-slow:
    run: bun run test-slow
    links: [node_modules]
    inputs:
      - src/**
      - test/**/*.slow.test.ts
      - test/support/repo.ts
      - test/support/postgres.ts
      - test/support/jobs.ts
      - package.json
      - tsconfig.json
      - docs/store.md
    sets: [push]
coverage: [src/**, scripts/**, test/**]
